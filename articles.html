<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMARNATH.M >> Articles | DevOps Insights</title>
    <meta name="description" content="DevOps articles, tutorials, and insights by Amarnath M">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyber-blue: #00d4ff;
            --cyber-purple: #9d00ff;
            --cyber-green: #00ff9d;
            --cyber-black: #0a0a0a;
            --cyber-gray: #1a1a1a;
            --cyber-light: #f0f0f0;
            --cyber-red: #ff5f56;
            --cyber-yellow: #ffbd2e;
            --cyber-orange: #ff8c00;
            --glow-blue: 0 0 10px var(--cyber-blue), 0 0 20px var(--cyber-blue);
            --glow-green: 0 0 10px var(--cyber-green), 0 0 20px var(--cyber-green);
            --card-gradient: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(157, 0, 255, 0.05));
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--cyber-black);
            color: var(--cyber-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background */
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.05) 0%, transparent 50%),
                linear-gradient(to bottom, #0a0a0a, #050505);
        }

        /* Header */
        .terminal-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red {
            background: #ff5f56;
        }

        .dot.yellow {
            background: #ffbd2e;
        }

        .dot.green {
            background: #27ca3f;
        }

        /* Navigation Button */
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(157, 0, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: var(--cyber-blue);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(157, 0, 255, 0.2));
            border-color: var(--cyber-blue);
            box-shadow: var(--glow-blue);
            transform: translateY(-2px);
        }

        .nav-btn i {
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .nav-btn span {
                display: none;
            }

            .nav-btn {
                padding: 10px 14px;
            }
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            margin-top: 70px;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: var(--cyber-blue);
            text-shadow: var(--glow-blue);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .page-subtitle {
            color: var(--cyber-green);
            font-size: clamp(1rem, 3vw, 1.3rem);
            text-shadow: var(--glow-green);
        }

        /* Search and Filter Section */
        .controls-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            flex: 1;
            max-width: 400px;
        }

        .search-box i {
            color: var(--cyber-blue);
            margin-right: 10px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--cyber-light);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
        }

        .search-box input::placeholder {
            color: rgba(240, 240, 240, 0.5);
        }

        .filter-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            background: transparent;
            color: var(--cyber-light);
            cursor: pointer;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--cyber-blue);
            color: var(--cyber-blue);
            box-shadow: var(--glow-blue);
        }

        /* Articles Grid */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        /* Article Card */
        .article-card {
            background: var(--card-gradient);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .article-card:hover {
            border-color: var(--cyber-blue);
            box-shadow: var(--glow-blue);
            transform: translateY(-5px);
        }

        .article-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(157, 0, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .article-image i {
            font-size: 4rem;
            color: var(--cyber-blue);
            opacity: 0.5;
        }

        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-content {
            padding: 20px;
        }

        .article-category {
            display: inline-block;
            background: rgba(0, 255, 157, 0.2);
            color: var(--cyber-green);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .article-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--cyber-light);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .article-description {
            color: rgba(240, 240, 240, 0.8);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(240, 240, 240, 0.5);
            font-size: 12px;
        }

        .article-date {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .read-more {
            color: var(--cyber-blue);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .article-card:hover .read-more {
            gap: 10px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(240, 240, 240, 0.5);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: var(--cyber-blue);
            opacity: 0.3;
        }

        .empty-state h3 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 10px;
        }

        /* Editor Link (hidden by default, only for local use) */
        .editor-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            color: var(--cyber-black);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.5rem;
            box-shadow: var(--glow-blue);
            transition: all 0.3s;
            z-index: 100;
        }

        .editor-link:hover {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }

            .controls-section {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }
        }



        /* Filter Dropdown */
        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .custom-select-wrapper {
            position: relative;
            min-width: 200px;
        }

        .filter-select {
            width: 100%;
            padding: 12px 40px 12px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--cyber-blue);
            border-radius: 8px;
            color: var(--cyber-blue);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-select:hover,
        .filter-select:focus {
            box-shadow: var(--glow-blue);
            background: rgba(0, 212, 255, 0.1);
        }

        .select-arrow {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cyber-blue);
            pointer-events: none;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="cyber-bg"></div>

    <!-- Header -->
    <div class="terminal-header">
        <div class="terminal-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>
        <a href="index.html" class="nav-btn">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
    </div>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <h1 class="page-title">ARTICLES</h1>
            <p class="page-subtitle">DevOps Insights & Tutorials</p>
        </div>

        <!-- Filter Controls -->
        <div class="filter-container">
            <div class="custom-select-wrapper">
                <select id="categoryFilter" class="filter-select" onchange="filterArticles(this.value)">
                    <option value="all">Filter by Tool (All)</option>
                    <option value="linux">Linux</option>
                    <option value="docker">Docker</option>
                    <option value="kubernetes">Kubernetes</option>
                    <option value="cicd">CI/CD</option>
                    <option value="git">Git</option>
                </select>
                <i class="fas fa-chevron-down select-arrow"></i>
            </div>
        </div>



        <!-- Articles Grid -->
        <div class="articles-grid" id="articlesGrid">
            <!-- Articles will be populated by JavaScript -->
        </div>
    </main>

    <!-- Editor Link (for writing new articles) -->
    <a href="editor.html" class="editor-link" title="Write New Article">
        <i class="fas fa-pen"></i>
    </a>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        let articlesData = [];
        let currentFilter = 'all';

        // Load articles on page load
        document.addEventListener('DOMContentLoaded', function () {
            loadArticles();
        });

        async function loadArticles() {
            try {
                // Show loading state
                document.getElementById('articlesGrid').innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-spinner fa-spin"></i>
                        <h3>Loading articles...</h3>
                    </div>
                `;

                // Load from Firebase
                articlesData = await getAllArticles();

                if (articlesData.length === 0) {
                    showEmptyState();
                } else {
                    renderArticles(articlesData);
                }
            } catch (error) {
                console.error('Error loading articles:', error);
                showEmptyState();
            }
        }

        function renderArticles(articles) {
            const grid = document.getElementById('articlesGrid');

            if (articles.length === 0) {
                showEmptyState();
                return;
            }

            grid.innerHTML = articles.map(article => createArticleCard(article)).join('');
        }

        function createArticleCard(article) {
            // Handle Firestore timestamp
            let dateStr = 'No date';
            if (article.createdAt) {
                const date = article.createdAt.toDate ? article.createdAt.toDate() : new Date(article.createdAt);
                dateStr = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }

            const imageHtml = article.images && article.images.length > 0
                ? `<img src="${article.images[0]}" alt="${article.title}">`
                : `<i class="fas fa-file-alt"></i>`;

            return `
                <div class="article-card" onclick="viewArticle('${article.id}')">
                    <div class="article-image">
                        ${imageHtml}
                    </div>
                    <div class="article-content">
                        <span class="article-category">
                            ${article.category}
                            ${article.visibility === 'private' ? '<i class="fas fa-lock" style="margin-left:5px;"></i>' : ''}
                        </span>
                        <h3 class="article-title">${article.title}</h3>
                        <p class="article-description">${article.description}</p>
                        <div class="article-meta">
                            <span class="article-date">
                                <i class="fas fa-calendar-alt"></i>
                                ${dateStr}
                            </span>
                            <span class="read-more">
                                Read More <i class="fas fa-arrow-right"></i>
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        function showEmptyState() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <i class="fas fa-newspaper"></i>
                    <h3>No Articles Found</h3>
                    <p>Start writing your first article using the editor!</p>
                </div>
            `;
        }

        function viewArticle(articleId) {
            window.location.href = `article.html?id=${articleId}`;
        }

        function filterArticles(category) {
            currentFilter = category;

            let filtered = articlesData;
            if (category !== 'all') {
                filtered = articlesData.filter(article => article.category === category);
            }
            renderArticles(filtered);
        }


    </script>
</body>

</html>
