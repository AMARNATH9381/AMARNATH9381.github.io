<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMARNATH.M >> Article</title>
    <meta name="description" content="DevOps article by Amarnath M">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyber-blue: #00d4ff;
            --cyber-purple: #9d00ff;
            --cyber-green: #00ff9d;
            --cyber-black: #0a0a0a;
            --cyber-gray: #1a1a1a;
            --cyber-light: #f0f0f0;
            --cyber-red: #ff5f56;
            --cyber-yellow: #ffbd2e;
            --glow-blue: 0 0 10px var(--cyber-blue), 0 0 20px var(--cyber-blue);
            --glow-green: 0 0 10px var(--cyber-green), 0 0 20px var(--cyber-green);
            --card-gradient: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(157, 0, 255, 0.05));
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--cyber-black);
            color: var(--cyber-light);
            line-height: 1.8;
            overflow-x: hidden;
        }

        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.05) 0%, transparent 50%),
                linear-gradient(to bottom, #0a0a0a, #050505);
        }

        /* Header */
        .terminal-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red {
            background: #ff5f56;
        }

        .dot.yellow {
            background: #ffbd2e;
        }

        .dot.green {
            background: #27ca3f;
        }

        /* Navigation Button */
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(157, 0, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: var(--cyber-blue);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(157, 0, 255, 0.2));
            border-color: var(--cyber-blue);
            box-shadow: var(--glow-blue);
            transform: translateY(-2px);
        }

        .nav-btn i {
            font-size: 16px;
        }

        @media (max-width: 480px) {
            .nav-btn span {
                display: none;
            }

            .nav-btn {
                padding: 10px 14px;
            }
        }

        /* Article Container */
        .article-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            margin-top: 70px;
        }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--cyber-blue);
            text-decoration: none;
            margin-bottom: 30px;
            padding: 8px 16px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: var(--glow-blue);
        }

        /* Article Header */
        .article-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .article-category {
            display: inline-block;
            background: rgba(0, 255, 157, 0.2);
            color: var(--cyber-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .article-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--cyber-blue);
            text-shadow: var(--glow-blue);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .article-meta {
            display: flex;
            gap: 25px;
            color: rgba(240, 240, 240, 0.6);
            font-size: 14px;
            flex-wrap: wrap;
        }

        .article-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-meta i {
            color: var(--cyber-blue);
        }

        /* Article Content */
        .article-content {
            font-size: 16px;
            line-height: 1.9;
        }

        .article-content h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-blue);
            font-size: 1.6rem;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .article-content h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-green);
            font-size: 1.3rem;
            margin: 30px 0 15px;
        }

        .article-content p {
            margin-bottom: 20px;
            color: rgba(240, 240, 240, 0.9);
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 20px;
            padding-left: 30px;
        }

        .article-content li {
            margin-bottom: 10px;
            color: rgba(240, 240, 240, 0.9);
        }

        .article-content strong {
            color: var(--cyber-blue);
        }

        .article-content code {
            background: rgba(0, 212, 255, 0.1);
            color: var(--cyber-green);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        .article-content pre {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 20px;
            margin: 25px 0;
            overflow-x: auto;
            position: relative;
        }

        .article-content pre code {
            background: none;
            padding: 0;
            color: var(--cyber-green);
            display: block;
            line-height: 1.6;
        }

        /* Code Copy Button */
        .code-copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: var(--cyber-blue);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .code-copy-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .code-copy-btn.copied {
            background: rgba(0, 255, 157, 0.3);
            border-color: var(--cyber-green);
            color: var(--cyber-green);
        }

        .article-content img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            margin: 25px 0;
            box-shadow: var(--glow-blue);
        }

        .article-content blockquote {
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid var(--cyber-blue);
            padding: 20px;
            margin: 25px 0;
            font-style: italic;
            color: rgba(240, 240, 240, 0.8);
        }

        /* Image Gallery */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .gallery-image {
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .gallery-image:hover {
            transform: scale(1.02);
            box-shadow: var(--glow-blue);
        }

        .gallery-image img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin: 0;
            border: none;
        }

        /* Edit Button */
        .edit-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-purple));
            color: var(--cyber-black);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.3rem;
            box-shadow: var(--glow-blue);
            transition: all 0.3s;
            z-index: 100;
        }

        .edit-btn:hover {
            transform: scale(1.1);
        }

        /* Image Modal */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            border: 2px solid var(--cyber-blue);
            box-shadow: var(--glow-blue);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid var(--cyber-blue);
            color: var(--cyber-blue);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(0, 212, 255, 0.4);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--cyber-blue);
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Not Found State */
        .not-found {
            text-align: center;
            padding: 60px;
        }

        .not-found i {
            font-size: 4rem;
            color: var(--cyber-red);
            margin-bottom: 20px;
        }

        .not-found h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyber-light);
            margin-bottom: 10px;
        }

        .not-found p {
            color: rgba(240, 240, 240, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .article-container {
                padding: 20px 15px;
            }

            .article-meta {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="cyber-bg"></div>

    <!-- Header -->
    <div class="terminal-header">
        <div class="terminal-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>
        <a href="index.html" class="nav-btn">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
    </div>

    <!-- Article Container -->
    <div class="article-container" id="articleContainer">
        <div class="loading">
            <i class="fas fa-spinner"></i>
            <p>Loading article...</p>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal">
        <button class="modal-close" onclick="closeImageModal()">
            <i class="fas fa-times"></i>
        </button>
        <img id="modalImage" src="" alt="Full size image">
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        let currentArticle = null;

        document.addEventListener('DOMContentLoaded', function () {
            loadArticle();
        });

        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                showNotFound();
                return;
            }

            try {
                // Load from Firebase
                currentArticle = await getArticleById(articleId);

                if (currentArticle) {
                    renderArticle(currentArticle);
                } else {
                    showNotFound();
                }
            } catch (error) {
                console.error('Error loading article:', error);
                showNotFound();
            }
        }

        function renderArticle(article) {
            const container = document.getElementById('articleContainer');

            // Handle Firestore timestamp
            let createdDate = 'Unknown date';
            let updatedDate = 'Unknown date';

            if (article.createdAt) {
                const created = article.createdAt.toDate ? article.createdAt.toDate() : new Date(article.createdAt);
                createdDate = created.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            if (article.updatedAt) {
                const updated = article.updatedAt.toDate ? article.updatedAt.toDate() : new Date(article.updatedAt);
                updatedDate = updated.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // Update page title
            document.title = `AMARNATH.M >> ${article.title}`;

            // Calculate read time (rough estimate: 200 words per minute)
            const wordCount = article.content.replace(/<[^>]*>/g, '').split(/\s+/).length;
            const readTime = Math.ceil(wordCount / 200);

            let imageGalleryHtml = '';
            if (article.images && article.images.length > 0) {
                imageGalleryHtml = `
                    <div class="image-gallery">
                        ${article.images.map((img, index) => `
                            <div class="gallery-image" onclick="openImageModal('${img}')">
                                <img src="${img}" alt="Screenshot ${index + 1}">
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const showUpdated = article.createdAt && article.updatedAt &&
                (article.createdAt.seconds !== article.updatedAt.seconds);

            container.innerHTML = `
                <a href="articles.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Articles
                </a>

                <article>
                    <header class="article-header">
                        <span class="article-category">${article.category}</span>
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-meta">
                            <span>
                                <i class="fas fa-calendar-alt"></i>
                                ${createdDate}
                            </span>
                            ${showUpdated ? `
                                <span>
                                    <i class="fas fa-edit"></i>
                                    Updated: ${updatedDate}
                                </span>
                            ` : ''}
                            <span>
                                <i class="fas fa-clock"></i>
                                ${readTime} min read
                            </span>
                        </div>
                    </header>

                    <div class="article-content">
                        ${article.content}
                    </div>

                    ${imageGalleryHtml ? `
                        <section>
                            <h2>Screenshots</h2>
                            ${imageGalleryHtml}
                        </section>
                    ` : ''}
                </article>

                <a href="editor.html?id=${article.id}" class="edit-btn" title="Edit Article">
                    <i class="fas fa-edit"></i>
                </a>
            `;
        }

        function showNotFound() {
            const container = document.getElementById('articleContainer');
            container.innerHTML = `
                <a href="articles.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Back to Articles
                </a>
                <div class="not-found">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>Article Not Found</h2>
                    <p>The article you're looking for doesn't exist or has been removed.</p>
                </div>
            `;
        }

        function openImageModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imageSrc;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });

        // Close modal on outside click
        document.getElementById('imageModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeImageModal();
            }
        });

        // Add copy buttons to all code blocks
        function addCopyButtonsToCodeBlocks() {
            const codeBlocks = document.querySelectorAll('.article-content pre');

            codeBlocks.forEach((pre, index) => {
                // Create copy button
                const copyBtn = document.createElement('button');
                copyBtn.className = 'code-copy-btn';
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                copyBtn.setAttribute('data-index', index);

                copyBtn.addEventListener('click', async function () {
                    const code = pre.querySelector('code');
                    const text = code ? code.textContent : pre.textContent;

                    try {
                        await navigator.clipboard.writeText(text);

                        // Show copied state
                        this.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        this.classList.add('copied');

                        // Reset after 2 seconds
                        setTimeout(() => {
                            this.innerHTML = '<i class="fas fa-copy"></i> Copy';
                            this.classList.remove('copied');
                        }, 2000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                        this.innerHTML = '<i class="fas fa-times"></i> Failed';
                        setTimeout(() => {
                            this.innerHTML = '<i class="fas fa-copy"></i> Copy';
                        }, 2000);
                    }
                });

                pre.appendChild(copyBtn);
            });
        }

        // Call after article is rendered
        const originalRenderArticle = renderArticle;
        renderArticle = function (article) {
            originalRenderArticle(article);
            // Wait for DOM to update
            setTimeout(addCopyButtonsToCodeBlocks, 100);
        };
    </script>
</body>

</html>
